<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="行きたい場所">
<title>行きたい場所マップ｜GOKIGEN</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
  /* 配色とフォントは index.html と同じもの（同じ家の別の部屋に見えるように） */
  :root {
    --bg:#f0f4ff; --white:#fff; --border:#e2e8f8;
    --text:#1a2340; --soft:#5a6580; --muted:#9aa0b8;
    --blue:#4a7eff; --green:#22c77a; --yellow:#ffb800;
    --orange:#ff6b35; --pink:#ff4d8d; --purple:#9b59ff; --red:#ff4444;
    --r:16px; --shadow:0 2px 12px rgba(74,126,255,.10);
    --head:112px;                      /* ヘッダー＋タブの高さ（地図の高さ計算に使う） */
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  html{background:var(--bg)}
  body{font-family:"Hiragino Sans","Yu Gothic Medium",sans-serif;background:var(--bg);color:var(--text);
    overflow-x:hidden}

  /* ===== ヘッダー ===== */
  .hd{background:linear-gradient(135deg,#4a7eff,#9b59ff 50%,#ff4d8d);padding:12px 14px 11px;
    display:flex;align-items:center;gap:10px}
  .hd .ht{font-size:17px;font-weight:800;color:#fff;letter-spacing:.04em;line-height:1.3;flex:1;min-width:0}
  .hd .hs{display:block;font-size:10.5px;font-weight:700;color:rgba(255,255,255,.8);letter-spacing:.02em}
  .hd button{flex:none;background:rgba(255,255,255,.22);border:1.5px solid rgba(255,255,255,.4);
    color:#fff;font-family:inherit;font-size:11.5px;font-weight:800;border-radius:999px;
    padding:7px 11px;cursor:pointer;white-space:nowrap}
  .hd a.home{flex:none;text-decoration:none;color:#fff;font-size:18px;opacity:.9}

  /* ===== タブ（3つ＋表示切替。スマホ幅で必ず1段） ===== */
  .tabs{display:flex;gap:5px;padding:9px 14px 0;align-items:center}
  .tabs .tb{flex:1 1 0;min-width:0;padding:8px 2px;border-radius:10px;border:1.5px solid var(--border);
    background:#fff;color:var(--muted);font-family:inherit;font-size:12px;font-weight:800;
    cursor:pointer;text-align:center;white-space:nowrap;line-height:1.2}
  .tabs .tb.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .tabs .tb .n{display:block;font-size:9.5px;font-weight:700;opacity:.85}
  .seg{display:flex;gap:0;padding:8px 14px 9px}
  .seg button{flex:1;padding:7px 4px;border:1.5px solid var(--border);background:#fff;color:var(--muted);
    font-family:inherit;font-size:12px;font-weight:800;cursor:pointer}
  .seg button:first-child{border-radius:10px 0 0 10px}
  .seg button:last-child{border-radius:0 10px 10px 0;border-left:none}
  .seg button.on{background:var(--purple);border-color:var(--purple);color:#fff}

  /* ===== 地図 ===== */
  #map{width:100%;height:calc(100vh - var(--head) - 46px);min-height:320px;background:#dfe7f7}
  .view{display:none}
  .view.on{display:block}
  .leaflet-container{font-family:inherit}
  .pin{display:flex;align-items:center;justify-content:center;border-radius:50% 50% 50% 4px;
    transform:rotate(-45deg);border:2.5px solid #fff;box-shadow:0 2px 6px rgba(26,35,64,.35);
    width:26px;height:26px}
  .pin i{transform:rotate(45deg);font-style:normal;font-size:12px;line-height:1}
  .pin.eff-high{background:var(--red)} .pin.eff-mid{background:var(--orange)} .pin.eff-low{background:var(--green)}
  .pin.done{background:var(--muted)}
  .pin .bdg{position:absolute;top:-9px;right:-9px;transform:rotate(45deg);font-size:11px}
  /* 凡例は地図の左下。OpenStreetMapのクレジット（右下・高さ約18px）に重ならない位置に置く */
  .maplg{position:absolute;left:10px;bottom:30px;z-index:500;background:rgba(255,255,255,.94);
    border:1.5px solid var(--border);border-radius:11px;padding:7px 9px;font-size:10.5px;
    font-weight:700;color:var(--soft);line-height:1.9;box-shadow:var(--shadow)}
  .maplg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;font-style:normal}

  /* ===== 写真タイル ===== */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:0 14px 28px}
  @media(min-width:720px){ .grid{grid-template-columns:repeat(4,1fr);max-width:1080px;margin:0 auto} }
  .tile{position:relative;border-radius:13px;overflow:hidden;background:var(--border);cursor:pointer;
    box-shadow:var(--shadow);border:none;padding:0;font-family:inherit;display:block;width:100%}
  .tile .ph{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#dfe7f7}
  .tile .ph.none{display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;
    background:linear-gradient(150deg,#e7ecfa,#dfe7f7);color:var(--soft);font-size:13px;font-weight:800;
    line-height:1.35;word-break:break-word}
  .tile .ov{position:absolute;left:0;right:0;bottom:0;padding:16px 9px 7px;text-align:left;
    background:linear-gradient(to top,rgba(12,18,38,.82),rgba(12,18,38,0))}
  .tile .tn{display:block;font-size:12px;font-weight:800;color:#fff;line-height:1.3;
    text-shadow:0 1px 3px rgba(0,0,0,.5);word-break:break-word}
  .tile .tt{display:block;font-size:9.5px;font-weight:700;color:rgba(255,255,255,.86);margin-top:2px}
  .tile .flg{position:absolute;top:7px;left:7px;font-size:14px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
  .gnote{padding:2px 14px 10px;font-size:11px;color:var(--muted);line-height:1.7}

  /* ===== ボトムシート ===== */
  .veil{position:fixed;inset:0;background:rgba(12,18,38,.5);z-index:900;opacity:0;pointer-events:none;
    transition:opacity .22s}
  .veil.on{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:901;background:#fff;
    border-radius:20px 20px 0 0;box-shadow:0 -6px 26px rgba(26,35,64,.24);
    transform:translateY(102%);transition:transform .26s cubic-bezier(.22,1,.36,1);
    max-height:92vh;max-height:92dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;
    max-width:640px;margin:0 auto}
  .sheet.on{transform:translateY(0)}
  .sheet .grip{width:40px;height:4px;border-radius:2px;background:var(--border);margin:9px auto 0}
  .sheet .hero{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#dfe7f7;margin-top:9px}
  .sheet .hero.none{display:flex;align-items:center;justify-content:center;text-align:center;padding:14px;
    background:linear-gradient(150deg,#e7ecfa,#dfe7f7);color:var(--soft);font-size:21px;font-weight:800;line-height:1.35}
  .sheet .bd{padding:13px 16px 18px}
  .sheet .nm{font-size:21px;font-weight:800;line-height:1.35;word-break:break-word}
  .sheet .ar{font-size:11.5px;font-weight:700;color:var(--muted);margin-top:3px}
  .sheet .cm{font-size:13.5px;line-height:1.85;color:var(--soft);margin-top:9px}
  .bdgs{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .bdg2{font-size:11px;font-weight:800;border-radius:999px;padding:5px 10px;background:var(--bg);
    border:1.5px solid var(--border);color:var(--soft);white-space:nowrap}
  .bdg2.eff-high{background:rgba(255,68,68,.10);border-color:rgba(255,68,68,.35);color:#c02020}
  .bdg2.eff-mid{background:rgba(255,107,53,.12);border-color:rgba(255,107,53,.35);color:#c0410f}
  .bdg2.eff-low{background:rgba(34,199,122,.12);border-color:rgba(34,199,122,.35);color:#128550}
  .acts{display:grid;grid-template-columns:1fr;gap:8px;margin-top:14px}
  .acts button,.acts a{display:flex;align-items:center;justify-content:center;gap:7px;padding:13px 10px;
    border-radius:13px;border:1.5px solid var(--border);background:var(--bg);color:var(--soft);
    font-family:inherit;font-size:13.5px;font-weight:800;cursor:pointer;text-decoration:none;text-align:center}
  .acts .go{background:linear-gradient(135deg,#4a7eff,#9b59ff);border-color:transparent;color:#fff}
  .acts a.off{opacity:.5;pointer-events:none;border-style:dashed}
  .cred{font-size:10px;color:var(--muted);line-height:1.7;margin-top:12px;word-break:break-word}
  .cred a{color:var(--muted)}
  .out{margin-top:12px;padding:11px 12px;border-radius:12px;background:rgba(34,199,122,.09);
    border:1.5px solid rgba(34,199,122,.3);font-size:12.5px;font-weight:700;line-height:1.7}
  .out a{color:#128550}

  /* ===== 「この旅を決める」ダイアログ ===== */
  .dlg{position:fixed;left:14px;right:14px;top:50%;transform:translateY(-50%) scale(.96);z-index:920;
    background:#fff;border-radius:18px;box-shadow:0 8px 30px rgba(26,35,64,.3);padding:16px;
    max-width:420px;margin:0 auto;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;
    max-height:88vh;overflow-y:auto}
  .dlg.on{opacity:1;pointer-events:auto;transform:translateY(-50%) scale(1)}
  .dlg .dt{font-size:15px;font-weight:800;line-height:1.5}
  .dlg .dl{font-size:11px;font-weight:800;color:var(--muted);margin:13px 0 6px}
  .chips{display:flex;flex-wrap:wrap;gap:5px}
  .chips button{padding:7px 0;width:calc(25% - 4px);border-radius:9px;border:1.5px solid var(--border);
    background:#fff;color:var(--soft);font-family:inherit;font-size:12px;font-weight:800;cursor:pointer}
  .chips.mo button{width:calc(16.666% - 5px);padding:7px 0}
  .chips button.on{background:var(--purple);border-color:var(--purple);color:#fff}
  .prev{margin-top:14px;padding:11px 12px;border-radius:12px;background:var(--bg);
    border:1.5px dashed var(--border);font-size:12.5px;font-weight:800;line-height:1.7;word-break:break-all}
  .dlg .row{display:flex;gap:8px;margin-top:12px}
  .dlg .row button{flex:1;padding:12px 8px;border-radius:12px;border:1.5px solid var(--border);
    background:#fff;color:var(--soft);font-family:inherit;font-size:13.5px;font-weight:800;cursor:pointer}
  .dlg .row button.go{background:linear-gradient(135deg,#4a7eff,#9b59ff);border-color:transparent;color:#fff}
  .done{margin-top:11px;font-size:12px;line-height:1.8;color:var(--green);font-weight:800;min-height:0}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(14px);z-index:960;
    background:rgba(26,35,64,.94);color:#fff;font-size:12.5px;font-weight:800;padding:11px 16px;
    border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:92vw;text-align:center}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .empty{padding:34px 20px;text-align:center;color:var(--muted);font-size:13px;line-height:1.9}
</style>
</head>
<body>

<div class="hd">
  <a class="home" href="./" title="GOKIGEN OSへ">🏠</a>
  <div class="ht">🗺 行きたい場所マップ<span class="hs" id="hsub">読み込み中…</span></div>
  <button onclick="share()">🔗 共有</button>
</div>

<div class="tabs" id="tabs"></div>
<div class="seg">
  <button id="sg-map" class="on" onclick="setView('map')">🗺 地図</button>
  <button id="sg-grid" onclick="setView('grid')">🖼 写真</button>
</div>

<div class="view on" id="v-map" style="position:relative">
  <div id="map"></div>
  <div class="maplg">
    <i style="background:#22c77a"></i>体力ひくめ<br>
    <i style="background:#ff6b35"></i>体力ふつう<br>
    <i style="background:#ff4444"></i>体力たかめ<br>
    📅 予定ずみ　🏁 行った
  </div>
</div>
<div class="view" id="v-grid">
  <div class="grid" id="grid"></div>
  <div class="gnote" id="gnote"></div>
</div>

<div class="veil" id="veil" onclick="closeAll()"></div>
<div class="sheet" id="sheet"><div class="grip"></div><div id="sheetBody"></div></div>
<div class="dlg" id="dlg"><div id="dlgBody"></div></div>
<div class="toast" id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
/* ===== 行きたい場所マップ（表示専用） =====
   ・data.json の places（Apps Scriptが台帳から作る）と
     places-photos.json（Wikimedia Commonsから1回だけ拾ってきた写真）を突き合わせる。
   ・**何も保存しない。** 「この旅を決める」は一文をクリップボードに入れるだけで、
     台帳・カレンダーを動かすのはClaudeとの会話。入力の窓口はチャット一本、という原則を守る。 */

var DATA=null, PHOTOS={}, TAB='jp', VIEW='map', MAP=null, LAYER=null, CUR=null, PICK={y:null,m:null};

/* ===== 小道具 ===== */
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.className='toast on';
  clearTimeout(toast._t);toast._t=setTimeout(function(){t.className='toast'},2600)}
function copy(text,msg){
  var done=function(){toast(msg||'コピーしました')};
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(done,function(){fallback()})}
  else fallback();
  function fallback(){
    var ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.top='-1000px';
    document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');done()}catch(e){toast('長押しでコピーしてください')}
    document.body.removeChild(ta);
  }
}
function share(){ copy(location.href,'このページのURLをコピーしました。LINEで送れます') }

/* ===== v1.7 場所の並べ替え・絞り込みここから =====
   ここから下の「ここまで」までは DOM に触らない
   （tools/test/test-places.js が、この範囲だけを切り出して検証するため）。 */

/* 推奨時期の早い順。台帳に無い書き方が出てきたら、その他（90）としていちばん後ろの手前に置く。
   状態が「済」の場所は、時期に関係なくいちばん最後（もう行ったので、選ぶ対象ではない）。 */
var PL_TIMING=['60代前半','62〜64歳','62〜67歳','2026〜2031','64〜67歳',
               '2031〜2033','2031〜2036','67歳以降でも可','後半戦でも可','定番候補'];
function plTimingRank(t){
  var s=String(t==null?'':t).trim();
  var i=PL_TIMING.indexOf(s);
  return i>=0? i : 90;
}
function plIsDone(p){ return /済/.test(String((p&&p.status)||'')) }
function plIsPlanned(p){ return /予定/.test(String((p&&p.status)||'')) }
function plSort(list){
  return list.slice().sort(function(a,b){
    var da=plIsDone(a)?1:0, db=plIsDone(b)?1:0;
    if(da!==db) return da-db;                                  // 行った場所は最後
    var ra=plTimingRank(a.timing), rb=plTimingRank(b.timing);
    if(ra!==rb) return ra-rb;
    return String(a.id||'')<String(b.id||'')? -1 : 1;          // 同じ時期なら台帳の並び
  });
}
/** タブの絞り込み。jp=日本／world=海外／teiban=定番 */
function plFilter(rows,tab){
  return (rows||[]).filter(function(p){
    var k=String(p.kind||'');
    if(tab==='teiban') return /定番/.test(k);
    if(tab==='world')  return /海外/.test(k);
    return /日本/.test(k);
  });
}
/** 写真は「台帳の写真URLが最優先」。空ならCommonsから拾った1枚。それも無ければ null */
function plPhoto(p,photos){
  if(p&&p.photo) return {url:p.photo,from:'台帳'};
  var c=photos&&photos[p&&p.name];
  return (c&&c.url)? {url:c.url,from:'commons',title:c.title,artist:c.artist,license:c.license,page:c.full} : null;
}
/** 映像。台帳に無ければ YouTube の検索を作る（4K の映像を探しやすいように） */
function plVideo(p){
  if(p&&p.video) return p.video;
  if(!p||!p.name) return null;
  return 'https://www.youtube.com/results?search_query='+encodeURIComponent(p.name+' 4K');
}
/** 体力のクラス名（ピンとバッジの色） */
function plEffort(p){
  var e=String((p&&p.effort)||'');
  return /高/.test(e)? 'high' : /中/.test(e)? 'mid' : /低/.test(e)? 'low' : 'na';
}
/** Claudeに貼る一文。ここだけは形をぜったいに変えない（Claude側が読む合図なので） */
function plDecision(name,year,month){
  return '🗺行きたい場所マップ｜'+name+'｜'+year+'年'+month+'月｜決定';
}
/** タブに出す件数（「🗾日本 33か所」の数字） */
function plCounts(rows){
  return { jp:plFilter(rows,'jp').length, world:plFilter(rows,'world').length,
           teiban:plFilter(rows,'teiban').length, all:(rows||[]).length,
           planned:(rows||[]).filter(plIsPlanned).length, done:(rows||[]).filter(plIsDone).length };
}
/* ===== v1.7 場所の並べ替え・絞り込みここまで ===== */

/* ===== 読み込み ===== */
function rows(){ return ((DATA&&DATA.places&&DATA.places.rows)||[]) }
async function load(){
  var t=Date.now();
  var got=await Promise.all([
    fetch('data.json?v='+t,{cache:'no-store'}).then(function(r){return r.ok?r.json():null}).catch(function(){return null}),
    fetch('places-photos.json?v='+t,{cache:'no-store'}).then(function(r){return r.ok?r.json():null}).catch(function(){return null})
  ]);
  DATA=got[0]; PHOTOS=(got[1]&&got[1].photos)||{};
  var c=plCounts(rows());
  document.getElementById('hsub').textContent = rows().length
    ? (c.all+'か所・予定'+c.planned+'・行った'+c.done)
    : 'まだ台帳を読み込めていません';
  renderTabs(); render();
}
function renderTabs(){
  var c=plCounts(rows());
  var t=[{k:'jp',l:'🗾 日本',n:c.jp},{k:'world',l:'🌍 世界',n:c.world},{k:'teiban',l:'🏕 定番',n:c.teiban}];
  document.getElementById('tabs').innerHTML=t.map(function(x){
    return '<button class="tb '+(TAB===x.k?'on':'')+'" onclick="setTab(\''+x.k+'\')">'+
           x.l+'<span class="n">'+x.n+'か所</span></button>'}).join('');
}
function setTab(k){ TAB=k; renderTabs(); render(); }
function setView(v){
  VIEW=v;
  document.getElementById('sg-map').className=(v==='map'?'on':'');
  document.getElementById('sg-grid').className=(v==='grid'?'on':'');
  document.getElementById('v-map').className='view'+(v==='map'?' on':'');
  document.getElementById('v-grid').className='view'+(v==='grid'?' on':'');
  render();
}
function render(){ VIEW==='map'? drawMap() : drawGrid() }

/* ===== 地図 ===== */
var VIEWS={ jp:[[24,122],[46,146]], world:[[-60,-170],[78,178]], teiban:[[35.2,138.3],[35.6,139.0]] };
function drawMap(){
  if(!MAP){
    MAP=L.map('map',{zoomControl:true,attributionControl:true});
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
      maxZoom:17,attribution:'&copy; OpenStreetMap contributors'}).addTo(MAP);
    MAP.setView([37,138],5);
  }
  if(LAYER) MAP.removeLayer(LAYER);
  LAYER=L.layerGroup().addTo(MAP);
  var list=plSort(plFilter(rows(),TAB)).filter(function(p){return p.lat!=null&&p.lng!=null});
  list.forEach(function(p){
    var done=plIsDone(p), cls='pin '+(done?'done':'eff-'+plEffort(p));
    var badge=plIsPlanned(p)? '<span class="bdg">📅</span>' : '';
    var icon=L.divIcon({className:'',iconSize:[26,26],iconAnchor:[13,26],
      html:'<div class="'+cls+'"><i>'+(done?'🏁':'')+'</i>'+badge+'</div>'});
    L.marker([p.lat,p.lng],{icon:icon,title:p.name}).addTo(LAYER)
      .on('click',function(){ openSheet(p.id) });
  });
  var b=VIEWS[TAB]||VIEWS.jp;
  MAP.fitBounds(L.latLngBounds(b),{padding:[18,18]});
  setTimeout(function(){ MAP.invalidateSize() },60);
}

/* ===== 写真タイル ===== */
function drawGrid(){
  var list=plSort(plFilter(rows(),TAB));
  var g=document.getElementById('grid');
  if(!list.length){ g.innerHTML='<div class="empty" style="grid-column:1/-1">この区分の場所はまだありません。</div>';
    document.getElementById('gnote').textContent=''; return; }
  g.innerHTML=list.map(function(p){
    var ph=plPhoto(p,PHOTOS);
    var img=ph? '<img class="ph" loading="lazy" src="'+esc(ph.url)+'" alt="'+esc(p.name)+'">'
              : '<div class="ph none">'+esc(p.name)+'</div>';
    return '<button class="tile" onclick="openSheet(\''+esc(p.id)+'\')">'+img+
      (plIsDone(p)? '<span class="flg">🏁</span>' : plIsPlanned(p)? '<span class="flg">📅</span>' : '')+
      '<span class="ov"><span class="tn">'+esc(p.name)+'</span>'+
      '<span class="tt">'+esc(p.timing||'')+'</span></span></button>';
  }).join('');
  document.getElementById('gnote').textContent=
    '推奨時期の早い順です（行った場所は最後）。写真はWikimedia Commonsから自動で当てています。';
}

/* ===== ボトムシート ===== */
function find(id){ return rows().filter(function(p){return String(p.id)===String(id)})[0]||null }
function openSheet(id){
  var p=find(id); if(!p) return;
  CUR=p;
  var ph=plPhoto(p,PHOTOS), vid=plVideo(p), eff=plEffort(p);
  var hero=ph? '<img class="hero" src="'+esc(ph.url)+'" alt="'+esc(p.name)+'">'
             : '<div class="hero none">'+esc(p.name)+'</div>';
  var bdg=[];
  if(p.effort) bdg.push('<span class="bdg2 eff-'+eff+'">💪 体力'+esc(p.effort)+'</span>');
  if(p.season) bdg.push('<span class="bdg2">🌤 ベスト '+esc(p.season)+'</span>');
  if(p.timing) bdg.push('<span class="bdg2">🗓 '+esc(p.timing)+'</span>');
  var cred='';
  if(ph&&ph.from==='commons'){
    cred='<div class="cred">写真: '+esc(ph.title||'')+(ph.artist? '／'+esc(ph.artist):'')+
      (ph.license? '／'+esc(ph.license):'')+'（Wikimedia Commons'+
      (ph.page? ' — <a href="'+esc(ph.page)+'" target="_blank" rel="noopener">出典</a>':'')+'）</div>';
  }
  var out='';
  if(plIsDone(p)&&p.output){
    out='<div class="out">🏁 行きました。<a href="'+esc(p.output)+'" target="_blank" rel="noopener">'+
        '公開した成果物を見る →</a></div>';
  }
  document.getElementById('sheetBody').innerHTML=
    hero+'<div class="bd">'+
    '<div class="nm">'+esc(p.name)+'</div>'+
    '<div class="ar">'+esc([p.area,p.withWhom?('同行 '+p.withWhom):''].filter(Boolean).join('　'))+'</div>'+
    (p.note? '<div class="cm">'+esc(p.note)+'</div>' : '')+
    '<div class="bdgs">'+bdg.join('')+'</div>'+ out +
    '<div class="acts">'+
      '<button class="go" onclick="openDlg()">🗓 この旅を決める</button>'+
      '<a href="'+esc(vid||'#')+'" target="_blank" rel="noopener"'+(vid?'':' class="off"')+'>🎬 映像を見る</a>'+
      '<a href="'+esc(p.source||'#')+'" target="_blank" rel="noopener"'+(p.source?'':' class="off"')+'>📖 もっと読む</a>'+
    '</div>'+ cred +'</div>';
  document.getElementById('sheet').className='sheet on';
  document.getElementById('veil').className='veil on';
}
function closeAll(){
  document.getElementById('sheet').className='sheet';
  document.getElementById('dlg').className='dlg';
  document.getElementById('veil').className='veil';
}
function closeDlg(){ document.getElementById('dlg').className='dlg' }

/* ===== 「この旅を決める」 ===== */
function openDlg(){
  if(!CUR) return;
  PICK={y:new Date().getFullYear(),m:null};
  drawDlg();
  document.getElementById('dlg').className='dlg on';
  document.getElementById('veil').className='veil on';
}
function pickY(y){ PICK.y=y; drawDlg() }
function pickM(m){ PICK.m=m; drawDlg() }
function drawDlg(){
  var ys=[],i;
  for(i=2026;i<=2036;i++) ys.push(i);
  var ms=[]; for(i=1;i<=12;i++) ms.push(i);
  var ready=PICK.y&&PICK.m;
  var line=ready? plDecision(CUR.name,PICK.y,PICK.m) : '年と月を選んでください';
  document.getElementById('dlgBody').innerHTML=
    '<div class="dt">🗓 '+esc(CUR.name)+' に行く時期を決める</div>'+
    '<div class="dl">年</div><div class="chips">'+ys.map(function(y){
      return '<button class="'+(PICK.y===y?'on':'')+'" onclick="pickY('+y+')">'+y+'</button>'}).join('')+'</div>'+
    '<div class="dl">月</div><div class="chips mo">'+ms.map(function(m){
      return '<button class="'+(PICK.m===m?'on':'')+'" onclick="pickM('+m+')">'+m+'月</button>'}).join('')+'</div>'+
    '<div class="prev" id="prev">'+esc(line)+'</div>'+
    '<div class="row"><button onclick="closeDlg()">やめる</button>'+
    '<button class="go" '+(ready?'':'disabled style="opacity:.45"')+' onclick="copyDecision()">📋 コピー</button></div>'+
    '<div class="done" id="dlgDone"></div>';
}
function copyDecision(){
  if(!CUR||!PICK.y||!PICK.m) return;
  copy(plDecision(CUR.name,PICK.y,PICK.m),'コピーしました');
  document.getElementById('dlgDone').innerHTML=
    'この一文をClaudeに貼れば、台帳・カレンダー・手配が動き出します。'+
    '家族の方はなかじまさんにLINEで送ってください。';
}

document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeAll() });
load();
</script>
</body>
</html>
